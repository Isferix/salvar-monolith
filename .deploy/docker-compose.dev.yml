services:
  api:
    container_name: "${API_CONTAINER_NAME}"
    build:
      context: ../api
      target: dev
      ssh:
        - default
    ports:
      - "${API_EXPOSE_PORT}:${API_INTERNAL_PORT}"
    volumes:
      - ../api/src:/code/src
      - ../api/.vscode:/code/.vscode
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/`)
      - traefik.http..routers.api.entrypoints=web,websecure
      - traefik.http.services.api.loadbalancer.server.port=${API_INTERNAL_PORT}
      - traefik.http.routers.api.priority=1
    networks:
      - appnet

  web:
    container_name: "${WEB_CONTAINER_NAME}"
    build:
      context: ../web
      target: dev
    ports:
      - "${WEB_EXPOSE_PORT}:${WEB_INTERNAL_PORT}"
    volumes:
      - ../web/src:/app/src
      - ../web/.vscode:/app/.vscode
    depends_on:
      - api
    environment:
      NODE_ENV: "dev"
      PORT: "${WEB_INTERNAL_PORT}"
      API_PORT: "${API_INTERNAL_PORT}"
    labels:
      - traefik.enable=true
      - treafik.http.routers.web.rule=PathPrefix(`/src`) || PathPrefix(`/assets`) || PathPrefix(`/@`) || PathPrefix(`/node_modules`)
      - traefik.http.routers.web.entrypoints=web,websecure
      - traefik.http.services.web.loadbalancer.server.port=${WEB_INTERNAL_PORT}
      - traefik.http.routers.web.priority=10
    networks:
      - appnet

  proxy:
    container_name: "${PROXY_CONTAINER_NAME}"
    image: traefik:v3.0
    command:
      - --configFile=/etc/traefik/traefik.yml
    depends_on:
      - web
    ports:
      - "${PROXY_EXPOSE_PORT}:80"
      - "${PROXY_DASHBOARD_PORT}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./proxy/traefik.yml:/etc/traefik/traefik.yml
    networks:
      - appnet

networks:
  appnet: