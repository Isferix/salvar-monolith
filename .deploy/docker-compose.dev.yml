services:
  db:
    container_name: "${DB_CONTAINER_NAME}"
    image: postgres:15
    command: postgres -c config_file=/etc/postgresql.conf
    environment:
      POSTGRES_USER: ${DB_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_POSTGRES_DB}
    ports:
      - "${DB_EXPOSE_PORT}:${DB_INTERNAL_PORT}"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/postgresql.dev.conf:/etc/postgresql.conf
      # The directory "./logs" is created by run.sh on the host. Postgres is
      # configured via customPostgresql.conf to write log messages to "/logs"
      # - ./logs:/logs
      # The container should use the user and group IDs from the host. When we set
      # the owner of /logs to the user "postgres" in the host (via run.sh), the ID
      # of the container's user "postgres" will match.
      # From https://stackoverflow.com/questions/23544282/what-is-the-best-way-to-manage-permissions-for-docker-shared-volumes#45640469
      # - /etc/passwd:/etc/passwd:ro
      # - /etc/group:/etc/group:ro      
    networks:
      - appnet
  
  api:
    container_name: "${API_CONTAINER_NAME}"
    depends_on:
      - db
    build:
      context: ..
      target: dev
      ssh:
        - default
    ports:
      - "${API_EXPOSE_PORT}:${API_INTERNAL_PORT}"
    environment:
      - DB_URI=postgresql://${DB_POSTGRES_USER}:${DB_POSTGRES_PASSWORD}@db:${DB_INTERNAL_PORT}/${DB_POSTGRES_DB}
      - environment=development
    volumes:
      - ../api/src:/code/src
      - ../api/.vscode:/code/.vscode
      - ../api/pyproject.toml:/code/pyproject.toml
      - ../api/uv.lock:/code/uv.lock
      - ../web:/code/web
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/static`) || PathPrefix(`/components`) || PathPrefix(`/`)
      - traefik.http.routers.api.entrypoints=web,websecure
      - traefik.http.services.api.loadbalancer.server.port=${API_INTERNAL_PORT}
    networks:
      - appnet
  
  cache:
    container_name: "${CACHE_CONTAINER_NAME}"
    depends_on:
      - api
    image: redis:7
    ports:
      - "${CACHE_EXPOSE_PORT}:${CACHE_INTERNAL_PORT}"
    volumes:
      - ./cache/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - appnet  
  
  proxy:
    container_name: "${PROXY_CONTAINER_NAME}"
    image: traefik:v3.0
    command:
      - --configFile=/etc/traefik/traefik.yml
    depends_on:
      - api
    ports:
      - "${PROXY_EXPOSE_PORT}:80"
      - "${PROXY_DASHBOARD_PORT}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./proxy/traefik.yml:/etc/traefik/traefik.yml
    networks:
      - appnet

networks:
  appnet:
volumes:
  db_data: