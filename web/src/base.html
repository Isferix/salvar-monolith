<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/static/manifest.json" />
    <meta name="theme-color" content="#1e2a38" />

    <title>{{ title or "Sistema Salvar"}}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script
      src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
      integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
      crossorigin="anonymous"
    ></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.11/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/idiomorph/dist/idiomorph-ext.min.js"></script>
    <style>
      body {
        background-color: #f4f6f9;
      }

      .sidebar {
        width: 240px;
        min-height: 100vh;
        background-color: #1e2a38;
        color: white;
      }

      .sidebar a {
        color: #cfd8e3;
        text-decoration: none;
      }

      .sidebar a:hover {
        color: white;
        background-color: #2f3f52;
      }

      .app-title {
        background-color: #2c3e50;
        color: white;
      }

      footer {
        background-color: #e9ecef;
      }
    </style>
  </head>
  <body>
    <div id="app" class="d-flex">
      {% include "layout/nav.html" %}
      <div class="flex-grow-1 d-flex flex-column">
        {% include "layout/header.html" %} {% include "layout/main.html" %} {% include "layout/footer.html" %}
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- <script src="https://unpkg.com/htmx.org"></script> -->
    <!-- <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) => console.log("Service Worker registrado", reg))
            .catch((err) => console.error("Error al registrar", err));
        });
      }
    </script> -->
    {% if is_dev %}
    <!-- Hot reload script -->
    {{ hot_reload.script(url_for('hot-reload')) | safe }} {% endif %}
  </body>
</html>
