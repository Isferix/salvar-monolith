<table class="table table-striped">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Nombre</th>
      <th scope="col">Apellido</th>
      <th scope="col">DNI</th>
    </tr>
  </thead>
  <tbody>
    {% for persona in personas %}
    <tr>
      <th scope="row">{{ persona.id }}</th>
      <td>{{ persona.nombre }}</td>
      <td>{{ persona.apellido }}</td>
      <td>{{ persona.dni or "N/A" }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
