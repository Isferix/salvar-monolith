[project]
name = "salvar-monolith"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "salvar-core",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.14.0",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.4",
    "fastapi[standard]>=0.136.1",
]

[dependency-groups]
dev = [
    "arel>=0.4.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.uv.sources]
salvar-core = { git = "ssh://git@github.com/Isferix/salvar-core.git", rev = "v0.5.1" }

[tool.ruff]
lint.extend-select = [
    'FAST001',
    'FAST002',
    'FAST003'
]
exclude = [
    "server/app/infrastructure/db/env.py"
]

