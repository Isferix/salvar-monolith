[default]
COMPANY = my_company
ENV = dev
PROJECT_NAME = my_project
COMPOSE_PROJECT_NAME= my_project-compose
VERSION = 1.0.0
GITHUB_SSH_KEY_PATH = ~/.ssh/id_ed25519

[api]
CONTAINER_NAME = 01-api_${PROJECT_NAME}_fastapi-dev
INTERNAL_PORT = 8000
EXPOSE_PORT = 8000

[web]
CONTAINER_NAME = 02-web_${PROJECT_NAME}_nunjucks-dev
INTERNAL_PORT = 3000
EXPOSE_PORT = 3000
DOMAIN_NAME = web.${PROJECT_NAME}.local

[proxy]
CONTAINER_NAME = 03-proxy_${PROJECT_NAME}_traefik-dev
DASHBOARD_PORT = 8080
EXPOSE_PORT = 8081