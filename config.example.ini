[default]
COMPANY = my_company
ENV = dev
PROJECT_NAME = my_project
COMPOSE_PROJECT_NAME= my_project-compose
VERSION = 1.0.0
GITHUB_SSH_KEY_PATH = ~/.ssh/id_ed25519

[db]
CONTAINER_NAME = 01-db_${PROJECT_NAME}_postgres-dev
POSTGRES_USER = postgres
POSTGRES_PASSWORD = postgres
POSTGRES_DB = ${PROJECT_NAME}_db
INTERNAL_PORT = 5432
EXPOSE_PORT = 5432

[api]
CONTAINER_NAME = 02-api_${PROJECT_NAME}_fastapi-dev
INTERNAL_PORT = 8000
EXPOSE_PORT = 8000

[cache]
CONTAINER_NAME = 03-cache_${PROJECT_NAME}_redis-dev
INTERNAL_PORT = 6379
EXPOSE_PORT = 6379


[proxy]
CONTAINER_NAME = 04-proxy_${PROJECT_NAME}_traefik-dev
DASHBOARD_PORT = 8080
EXPOSE_PORT = 8081